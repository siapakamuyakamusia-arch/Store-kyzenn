<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog - Kyzann Bussines</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/list.css">
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        button, a, input, *:focus {
            outline: none !important;
        }
        .cat-btn, .sub-cat-btn, .order-btn-card {
            border-style: solid !important;
        }
        .product-card .order-btn-card {
            background: #f43f5e !important;
            color: #ffffff !important;
            font-weight: bold !important;
            border: none !important;
            padding: 10px 14px !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            box-shadow: 0 4px 10px rgba(244, 63, 94, 0.4) !important;
            opacity: 1 !important;
            visibility: visible !important;
        }
        .content-card-body .order-btn-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 10px;
            color: #ffffff !important;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        #productModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #productModal.show {
            display: flex !important;
        }
        .modal-box {
            background: #1f1124;
            border: 1px solid #f43f5e;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            padding: 20px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 16px;
            color: #38bdf8;
        }
        .close-btn {
            background: none;
            border: none;
            color: #f43f5e;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-price {
            font-size: 18px;
            font-weight: bold;
            color: #f43f5e;
            margin-bottom: 12px;
        }
        .qty-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-size: 14px;
        }
        .qty-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-buttons button {
            background: #f43f5e;
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .qty-buttons input {
            width: 40px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 6px;
            padding: 4px 0;
        }
        .modal-total-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-top: 1px dashed rgba(255,255,255,0.2);
            margin-bottom: 15px;
            font-size: 15px;
        }
        .modal-total-box strong {
            color: #4ade80;
            font-size: 17px;
        }
        .checkout-btn {
            width: 100%;
            background: #25D366;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="bg-cute"></div>

    <div class="container">
        
        <div class="top-header">
            <div class="header-brand">
                <img src="assets/images/Kyzenn.jpg" alt="Logo" class="header-avatar">
                <h1 class="header-title">KYZANN BUSSINES</h1>
            </div>
        </div>

        <div class="banner-card">
            <span class="banner-tag" id="bannerTag">PROMO</span>
            
            <div class="banner-content" id="bannerContent">
                <div class="banner-title" id="bannerTitle">
                    <i class="fa-solid fa-gem"></i> KYZANN BUSSINES
                </div>
                <div class="banner-desc" id="bannerDesc">
                    Pusat Aplikasi Premium & Layanan Virtual Terpercaya dengan Harga Terjangkau.
                </div>
            </div>

            <div class="banner-dots">
                <div class="dot active" onclick="setSlide(0)"></div>
                <div class="dot" onclick="setSlide(1)"></div>
                <div class="dot" onclick="setSlide(2)"></div>
            </div>
        </div>

        <div class="category-container">
            <div class="category-scroll">
                <!-- Urutan tombol: Information di paling kiri (sebelah Editing App) -->
                <button class="cat-btn active" onclick="switchCategory('info', this)">
                    <i class="fa-solid fa-circle-info"></i> INFORMATION
                </button>
                <button class="cat-btn" onclick="switchCategory('editing', this)">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> EDITING APP
                </button>
                <button class="cat-btn" onclick="switchCategory('education', this)">
                    <i class="fa-solid fa-graduation-cap"></i> EDUCATION APP
                </button>
                <button class="cat-btn" onclick="switchCategory('music', this)">
                    <i class="fa-solid fa-music"></i> MUSIC APP
                </button>
                <button class="cat-btn" onclick="switchCategory('streaming', this)">
                    <i class="fa-solid fa-tv"></i> STREAMING APP
                </button>
                <button class="cat-btn" onclick="switchCategory('other', this)">
                    <i class="fa-solid fa-shapes"></i> OTHER APP
                </button>
                <button class="cat-btn" onclick="switchCategory('nokos', this)">
                    <i class="fa-solid fa-sim-card"></i> NOKOS
                </button>
                <button class="cat-btn" onclick="switchCategory('sewabot', this)">
                    <i class="fa-solid fa-robot"></i> SEWA BOT
                </button>
            </div>
        </div>

        <div class="section-title-bar">
            <span class="section-title-text" id="sectionTitle">INFORMATION & RULES</span>
            <i class="fa-solid fa-star" id="sectionIcon"></i>
        </div>

        <div id="categoryContent" style="opacity: 1;"></div>

    </div>

    <!-- POP-UP MODAL ORDER -->
    <div id="productModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalProductName">Nama Produk</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-price" id="modalProductPrice">Rp 0</div>
                
                <div class="modal-desc-box" style="text-align: left; font-size: 13px; line-height: 1.6; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;">
                    <strong><i class="fa-solid fa-circle-info" style="color:#f59e0b;"></i> Syarat & Ketentuan:</strong>
                    <div id="modalProductDesc" style="margin-top: 6px; color: #ddd;"></div>
                </div>

                <div class="qty-control">
                    <span>Jumlah Order:</span>
                    <div class="qty-buttons">
                        <button type="button" onclick="changeQty(-1)">-</button>
                        <input type="text" id="modalQty" value="1" readonly>
                        <button type="button" onclick="changeQty(1)">+</button>
                    </div>
                </div>

                <div class="modal-total-box">
                    <span>Total Bayar:</span>
                    <strong id="modalTotal">Rp 0</strong>
                </div>

                <button class="checkout-btn" onclick="checkoutWA()">
                    <i class="fa-brands fa-whatsapp"></i> Order via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
        </a>
        <a href="list.html" class="nav-item active">
            <i class="fa-solid fa-store"></i>
        </a>
    </div>

    <script src="assets/js/list.js"></script>
</body>
</html>
